; PepeBot firmware, rev A body (ESP32-S3)
; STATUS: written against the protocol in packages/protocol. Not yet flashed on rev A hardware.

[env:pepebot-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = -DPEPEBOT_FW=\"0.1.0\"
lib_deps =
  links2004/WebSockets@^2.4.1
  bblanchon/ArduinoJson@^7.0.4
  adafruit/Adafruit PWM Servo Driver Library@^3.0.2
  fastled/FastLED@^3.7.0
