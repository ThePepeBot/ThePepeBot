ot]</tspan><tspan fill="#c9d6bf">  mode=</tspan><tspan fill="#ffae1a">SIMULATION</tspan><tspan fill="#c9d6bf">  broadcast=</tspan><tspan fill="#ffae1a">OFF</tspan><tspan fill="#c9d6bf">  kill_switch=</tspan><tspan fill="#b8ff4f">SAFE</tspan></text><text x="66" y="218.5" font-size="14" xml:space="preserve" class="ln5" style="white-space:pre"><tspan fill="#6c7a66" font-weight="700">[boot]</tspan><tspan fill="#c9d6bf">  modules  fee-intake  treasury  router  pepe-swap  asset-bay  distributor</tspan></text><text x="66" y="241.0" font-size="14" xml:space="preserve" class="ln6" style="white-space:pre"><tspan fill="#14f195" font-weight="700">[link]</tspan><tspan fill="#c9d6bf">  backend http://localhost:8080  </tspan><tspan fill="#b8ff4f">(events forwarded)</tspan></text><text x="66" y="263.5" font-size="14" xml:space="preserve" class="ln7" style="white-space:pre"><tspan fill="#ff2d17" font-weight="700">[bot]</tspan><tspan fill="#c9d6bf">   emote -&gt; </tspan><tspan fill="#ff2d17">WAKE</tspan><tspan fill="#c9d6bf">     eyes:ramp  leds:sweep  servo:stand</tspan></text><text x="66" y="286.0" font-size="14" xml:space="preserve" class="ln8" style="white-space:pre"><tspan fill="#ffae1a" font-weight="700">[fee]</tspan><tspan fill="#c9d6bf">   tick  venue=adapter:mock  pool=PEPEBOT/SOL</tspan></text><text x="66" y="308.5" font-size="14" xml:space="preserve" class="ln9" style="white-space:pre"><tspan fill="#ffae1a" font-weight="700">[fee]</tspan><tspan fill="#c9d6bf">   claimable  12.500 SOL  </tspan><tspan fill="#ffae1a">(simulated)</tspan></text><text x="66" y="331.0" font-size="14" xml:space="preserve" class="ln10" style="white-space:pre"><tspan fill="#ff2d17" font-weight="700">[bot]</tspan><tspan fill="#c9d6bf">   emote -&gt; </tspan><tspan fill="#ff2d17">FEED</tspan><tspan fill="#c9d6bf">     eyes:pulse  leds:amber chase  arms:grab</tspan></text><text x="66" y="353.5" font-size="14" xml:space="preserve" class="ln11" style="white-space:pre"><tspan fill="#b8ff4f" font-weight="